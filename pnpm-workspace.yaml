packages:
  - apps/*
  - packages/*
allowBuilds:
  electron-winstaller: true
  esbuild: false
nodeLinker: hoisted
# semver 6.3.1 is a backport published without the provenance of the 7.x
# releases before it, so pnpm's trust policy (no-downgrade, the org's CI
# policy) rejects it. Storybook pulls it in through react-docgen and Babel.
trustPolicyExclude:
  - semver@6.3.1
