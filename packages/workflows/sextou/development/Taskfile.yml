# Checks out a repository into the run's workspace, then runs claude -p in
# it: git/checkout's Taskfile, then harness/claude-headless's, both on the
# task's context. It reads from it what each of them reads:
#
#   repo, ref, server   what git/checkout clones, repo and ref required
#   base                a branch git/checkout fetches with ref, optional
#   path                where in the workspace, . by default: the checkout
#                       clones there, and claude runs there
#   prompt              what claude is asked, required
#   worktree            true, or a name: claude works in a new git worktree
#                       of the checkout
#
# and claude's options, as harness/claude-headless's Taskfile lists them.
# claude runs only once the checkout succeeded: a failed checkout ends the
# run with its code, as a failed claude does with claude's.
#
# It needs node, git and claude on the runner's machine, each step read by
# the variables of the runner's environment its own Taskfile names, and
# trusts claude with what harness/claude-headless's Taskfile says.
version: '3'

includes:
  checkout: ../../git/checkout
  claude: ../../harness/claude-headless

tasks:
  default:
    cmds:
      - task: checkout:default
      - task: claude:default
