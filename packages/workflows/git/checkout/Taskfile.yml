# Clones a repository at a ref into the run's workspace, with checkout.ts. It
# reads from the task's context:
#
#   repo    owner/name, required
#   ref     a full commit SHA, a branch or a tag, required
#   path    where in the workspace, . by default
#   server  where repo lives, an https URL, https://github.com by default
#
# Run it as a task's Taskfile, or include it from another (includes:
# checkout: ../git/checkout) and call checkout:default before the steps that
# work on the files. It needs node and git on the runner's machine, and
# reaches only public repositories. Its git may take 5 minutes, all of it
# together, unless CHECKOUT_TIMEOUT_MS in the runner's environment sets
# another number of milliseconds. One checkout per path: a second one into
# a folder that holds a repository fails.
version: '3'

tasks:
  default:
    # The script gets the context and the workspace through its environment,
    # never pasted into a command. go-task lets the runner's own environment
    # win over these, hence names no other program sets.
    env:
      CHECKOUT_CONTEXT: '{{.CONTEXT}}'
      CHECKOUT_WORKSPACE: '{{.WORKSPACE}}'
    cmds:
      - node {{joinPath .TASKFILE_DIR "main.ts" | q}}
