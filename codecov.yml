# Codecov reports coverage. It doesn't gate it: each suite's own 90% floor,
# in checks.yml, is the gate. checks.yml uploads one report per package and
# level, flagged "<package>-<level>".
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# A pull request runs some levels only for the packages its changes reach,
# so a flag it uploads no report for keeps its last coverage, from the pull
# request's commits before or from main, instead of showing none.
flag_management:
  default_rules:
    carryforward: true

# The pull request's comment shows the whole project's coverage and each
# flag's, beside the lines the pull request changed.
comment:
  layout: 'diff, flags, files'
  hide_project_coverage: false
