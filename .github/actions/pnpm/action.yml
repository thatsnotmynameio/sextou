# Node and pnpm for a job of checks.yml, then the workspace's install. It runs
# under the organization's pnpm policy, which checks.yml's env sets for every
# step of the job, this action's included.
name: pnpm
description: Sets up Node and the pinned pnpm, then installs the workspace.

inputs:
  install:
    description: "'false' sets up Node and pnpm without installing anything."
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        package-manager-cache: false
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 12.10.1
    # The store and the cache under $RUNNER_TEMP, for the install alone: the
    # commands after it in the job read neither. The action writes no
    # $GITHUB_ENV, which zizmor flags in any composite action, since one can't
    # know the workflow that calls it. An input is a string, so 'false' is
    # compared, not read as a boolean, which would take it as true.
    - name: pnpm install
      if: ${{ inputs.install == 'true' }}
      shell: bash
      env:
        pnpm_config_store_dir: ${{ runner.temp }}/pnpm-store
        pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-cache
      run: pnpm install --frozen-lockfile --ignore-scripts
