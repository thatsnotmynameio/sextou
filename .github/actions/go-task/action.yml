# go-task, as task on the PATH, for the suites that run it: the release,
# checked against its checksum. checks.yml decides which jobs call it.
name: go-task
description: Installs the pinned go-task release as task on the PATH.

runs:
  using: composite
  steps:
    # task goes into ~/.local/bin, which the Ubuntu runner image already puts
    # on the PATH (actions/runner-images, install-python.sh), so the action
    # writes neither $GITHUB_PATH nor $GITHUB_ENV: zizmor flags any such write
    # in a composite action, which can't know the workflow that calls it.
    - name: go-task
      shell: bash
      env:
        # The release, and its task_linux_amd64.tar.gz checksum from the
        # release's task_checksums.txt.
        GO_TASK_VERSION: 3.54.0
        GO_TASK_SHA256: 680859dbb4d881a9c72d4d9a8f510825450849af8567deacd7302c01124416fb
      run: |
        archive="$RUNNER_TEMP/task.tar.gz"
        curl -fsSL --proto '=https' --tlsv1.2 --max-time 120 -o "$archive" \
          "https://github.com/go-task/task/releases/download/v$GO_TASK_VERSION/task_linux_amd64.tar.gz"
        echo "$GO_TASK_SHA256  $archive" | sha256sum -c -
        mkdir -p "$HOME/.local/bin"
        tar -xzf "$archive" -C "$HOME/.local/bin" task
        if [ "$(command -v task)" != "$HOME/.local/bin/task" ]; then
          echo "::error::task resolves to '$(command -v task)', not $HOME/.local/bin/task: is ~/.local/bin on the PATH?"
          exit 1
        fi
