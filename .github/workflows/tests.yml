# Each package's test levels and its mutation run, each as a check of its own
# named after the package: "<package> / <level>" judges every file that level
# answers for at 90% coverage, "<package> / mutation" judges every file of its
# unit and integration suites: Stryker fails it below 80% of mutants
# killed in the package. The packages job lists the checks. The organization's
# typescript.yml still runs the unit and integration suites through the root
# vitest.config.ts; this moves there later. No check here is required yet.
#
# A change to documentation only (Markdown, LICENSE), against the pull
# request's base or the commit main had before the push, runs no check: the
# level and mutation jobs skip, which a required check counts as passed, where
# a paths filter on the workflow would leave it pending. Any other change runs
# every check.
#
# Mutation runs as in StrykerJS's own CI: in full on each push to main, and
# incrementally on a pull request, from the newest result in the Actions
# cache, which GitHub looks up in the pull request's scope first, then in
# main's. A Dependabot pull request never saves, so it always starts from
# main's result.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A pull request's newer run cancels the older one; each commit on main gets a
# group of its own and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The organization's pnpm policy, as its typescript.yml sets it. pnpm reads
# this repository's exceptions from pnpm-workspace.yaml.
env:
  PNPM_VERSION: 12.10.1
  pnpm_config_minimum_release_age: 1440
  pnpm_config_minimum_release_age_strict: true
  pnpm_config_trust_policy: no-downgrade
  pnpm_config_trust_lockfile: false
  pnpm_config_dangerously_allow_all_builds: false
  pnpm_config_strict_dep_builds: false
  pnpm_config_block_exotic_subdeps: false
  pnpm_config_pm_on_fail: ignore
  pnpm_config_verify_store_integrity: true
  pnpm_config_side_effects_cache: false
  pnpm_config_registry: https://registry.npmjs.org/

jobs:
  # The matrices of the jobs below, read from each workspace package's
  # package.json: a "test:<level>" script is a level, "test:mutation" a
  # mutation run. The root, whose scripts run every package, is no workspace
  # package.
  packages:
    name: packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      levels: ${{ steps.matrix.outputs.levels }}
      mutation: ${{ steps.matrix.outputs.mutation }}
    steps:
      # The whole history, so git finds where the branch forked.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The shell expands pnpm-workspace.yaml's globs, read with yq; $dir and
      # $package are jq's variables, not the shell's. shell: bash adds
      # pipefail, and failglob fails on a glob that matches nothing, so a
      # package.json jq can't read fails the step instead of dropping checks.
      # A run with no base (a manual run) lists every package, as does one
      # whose base git can't diff (a new branch's all-zero before).
      - name: Matrix
        id: matrix
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          shopt -s failglob
          manifests=$(yq '.packages[] + "/package.json"' pnpm-workspace.yaml)
          if [ -n "$BASE" ] && git diff --quiet "$BASE...HEAD" -- . \
            ':(exclude,glob)**/*.md' ':!LICENSE'; then
            manifests=
          fi
          # With no package, jq reads nothing and writes empty lists.
          # shellcheck disable=SC2016,SC2086
          jq -nr '
              [inputs | (input_filename | rtrimstr("/package.json")) as $dir
                | (.name | sub("^@[^/]+/"; "")) as $package
                | .scripts // {} | keys[] | capture("^test:(?<level>.+)$").level
                | {package: $package, level: ., dir: $dir}]
              | "levels=\(map(select(.level != "mutation")) | tojson)",
                "mutation=\(map(select(.level == "mutation") | del(.level)) | tojson)"' \
            $manifests < /dev/null \
            | tee -a "$GITHUB_OUTPUT"

  level:
    name: ${{ matrix.package }} / ${{ matrix.level }}
    needs: packages
    # An empty matrix is an error, so no level skips the job.
    if: ${{ needs.packages.outputs.levels != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.packages.outputs.levels) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: pnpm store
        run: |
          {
            echo "pnpm_config_store_dir=$RUNNER_TEMP/pnpm-store"
            echo "pnpm_config_cache_dir=$RUNNER_TEMP/pnpm-cache"
          } >> "$GITHUB_ENV"
      - name: pnpm install
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Only a component suite renders in a browser.
      - name: Chromium
        if: ${{ matrix.level == 'component' }}
        env:
          DIR: ${{ matrix.dir }}
        run: pnpm --dir "$DIR" exec playwright install --with-deps chromium
      - name: Tests
        env:
          DIR: ${{ matrix.dir }}
          LEVEL: ${{ matrix.level }}
        run: pnpm --dir "$DIR" run "test:$LEVEL"

  mutation:
    name: ${{ matrix.package }} / mutation
    needs: packages
    if: ${{ needs.packages.outputs.mutation != '[]' }}
    runs-on: ubuntu-latest
    # A run with no cached result mutates every file of the package.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.packages.outputs.mutation) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: pnpm store
        run: |
          {
            echo "pnpm_config_store_dir=$RUNNER_TEMP/pnpm-store"
            echo "pnpm_config_cache_dir=$RUNNER_TEMP/pnpm-cache"
          } >> "$GITHUB_ENV"
      - name: pnpm install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Restore the last result
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.dir }}/reports/stryker-incremental.json
          key: stryker-incremental-${{ matrix.package }}/${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: stryker-incremental-${{ matrix.package }}/
      # On main every mutant runs (--force) and the result is written for the
      # pull requests after it; a pull request runs only what changed since
      # the result it restored.
      - name: Stryker
        env:
          DIR: ${{ matrix.dir }}
          FULL: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ "$FULL" = true ]; then
            pnpm --dir "$DIR" run test:mutation --incremental --force
          else
            pnpm --dir "$DIR" run test:mutation --incremental
          fi
      - name: Save the result
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.dir }}/reports/stryker-incremental.json
          key: stryker-incremental-${{ matrix.package }}/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload the report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-${{ matrix.package }}
          path: ${{ matrix.dir }}/reports/mutation/mutation.html
          if-no-files-found: ignore
