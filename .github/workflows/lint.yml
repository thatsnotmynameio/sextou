# The lint rules most large open-source TypeScript and React projects enforce,
# from .oxlintrc.gates.json, each at error: "lint / gates" fails on any
# finding. The organization's typescript.yml lints with .oxlintrc.json and
# doesn't read this file; this moves there later. It isn't required yet.
name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A pull request's newer run cancels the older one; each commit on main gets a
# group of its own and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The organization's pnpm policy, as its typescript.yml sets it. pnpm reads
# this repository's exceptions from pnpm-workspace.yaml.
env:
  PNPM_VERSION: 12.10.1
  pnpm_config_minimum_release_age: 1440
  pnpm_config_minimum_release_age_strict: true
  pnpm_config_trust_policy: no-downgrade
  pnpm_config_trust_lockfile: false
  pnpm_config_dangerously_allow_all_builds: false
  pnpm_config_strict_dep_builds: false
  pnpm_config_block_exotic_subdeps: false
  pnpm_config_pm_on_fail: ignore
  pnpm_config_verify_store_integrity: true
  pnpm_config_side_effects_cache: false
  pnpm_config_registry: https://registry.npmjs.org/

jobs:
  gates:
    name: lint / gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: pnpm store
        run: |
          {
            echo "pnpm_config_store_dir=$RUNNER_TEMP/pnpm-store"
            echo "pnpm_config_cache_dir=$RUNNER_TEMP/pnpm-cache"
          } >> "$GITHUB_ENV"
      - name: pnpm install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: oxlint
        run: pnpm exec oxlint --config .oxlintrc.gates.json --format github .
